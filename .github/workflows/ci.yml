name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: coverage run --branch -m pytest
      - run: coverage report --fail-under=60
      - run: ruff check .
      - run: ruff format --check .
      - run: python dsh-teach/scripts/teach.py validate dsh-capsule
      - run: python dsh-teach/scripts/teach.py validate dsh-teach
      - run: python dsh-teach/scripts/teach.py validate dsh-time-machine
      - run: python dsh-teach/scripts/teach.py eval-report examples/dsh-teach-full-eval/eval --require-promotion

  dsh-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint:package
      - name: Pack release tarball
        run: echo "TARBALL=$(npm pack --silent)" >> "$GITHUB_ENV"
      - name: Install into latest DSH profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: npx --yes @deepseek-ai/dsh@latest plugin --profile headless add "./$TARBALL"
      - name: Verify composed bundle layer
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: npx --yes @deepseek-ai/dsh@latest --profile headless --dump-config | grep -F '# == dsh-session-lab'
