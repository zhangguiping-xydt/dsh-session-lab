name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements-dev.txt
      - run: coverage run --branch -m pytest
      - run: coverage report --fail-under=60
      - run: ruff check .
      - run: ruff format --check .
      - run: python dsh-teach/scripts/teach.py validate dsh-capsule
      - run: python dsh-teach/scripts/teach.py validate dsh-teach
      - run: python dsh-teach/scripts/teach.py validate dsh-time-machine
      - run: python dsh-teach/scripts/teach.py eval-report examples/dsh-teach-full-eval/eval --require-promotion

  dsh-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Pin the DSH release under test so CI remains reproducible; update this
      # when a new npm latest release is intentionally adopted.
      DSH_VERSION: 0.1.1-rc.2
      NPM_CONFIG_REGISTRY: https://registry.npmjs.org
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint:package
      - name: Pack release tarball
        run: |
          npm pack --silent
          version="$(node -p "require('./package.json').version")"
          printf 'TARBALL=dsh-session-lab-%s.tgz\n' "$version" >> "$GITHUB_ENV"
      - name: Install into latest DSH profile
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: npx --yes --registry=https://registry.npmjs.org "@deepseek-ai/dsh@${DSH_VERSION}" plugin --profile headless add "./$TARBALL"
      - name: Verify composed bundle layer
        env:
          DSH_HOME: ${{ runner.temp }}/dsh-home
        run: npx --yes --registry=https://registry.npmjs.org "@deepseek-ai/dsh@${DSH_VERSION}" --profile headless --dump-config | grep -F '# == dsh-session-lab'
